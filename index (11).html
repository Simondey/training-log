<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Simon's Training" />
  <title>Simon's Training Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #00FF87;
      --accent2: #00C6FF;
      --bg: #0a0a0f;
      --card: #13131a;
      --card2: #1a1a24;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --muted: #6b6b80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
    input[type=number] { -moz-appearance: textfield; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
    ::-webkit-scrollbar { display: none; }
    button { font-family: 'DM Sans', sans-serif; }
    /* 75 Soft badge */
    #soft75-badge { background: rgba(255,180,0,0.08); border: 1px solid rgba(255,180,0,0.3); border-radius: 14px; padding: 10px 14px; text-align: center; min-width: 80px; }
    #soft75-label { font-size: 9px; color: #FFB400; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    #soft75-day { font-size: 20px; font-weight: 700; color: #FFB400; font-family: 'DM Mono', monospace; line-height: 1.1; }
    #soft75-sub { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; }
    #soft75-bar-wrap { margin-top: 6px; background: var(--border); border-radius: 4px; height: 4px; width: 100%; }
    #soft75-bar { height: 4px; border-radius: 4px; background: #FFB400; transition: width 0.3s; }
    /* Water counter */
    #water-bar-wrap { width: 100%; background: var(--border); border-radius: 4px; height: 5px; margin-top: 6px; }
    #water-bar { height: 5px; border-radius: 4px; background: var(--accent2); transition: width 0.3s; }
    #water-widget { background: var(--card2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin: 12px 16px 0; display: flex; align-items: center; gap: 12px; }
    #water-controls { display: flex; align-items: center; gap: 10px; }
    .water-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #water-count { font-size: 15px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--accent2); min-width: 52px; text-align: center; }
    /* Reading checkbox */
    .reading-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin: 0 16px 12px; display: flex; align-items: center; justify-content: space-between; }
    .reading-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .reading-check-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-family: 'DM Mono', monospace; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .reading-check-btn.done { background: rgba(0,255,135,0.12); border-color: var(--accent); color: var(--accent); }
    /* Active recovery */
    .recovery-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin: 0 16px 12px; padding: 16px; }
    .recovery-title { font-size: 11px; color: #FF87AB; font-family: 'DM Mono', monospace; letter-spacing: 1px; margin-bottom: 12px; }
    .recovery-option { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .recovery-option:last-of-type { border-bottom: none; }
    .recovery-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .recovery-radio.selected { border-color: #FF87AB; background: #FF87AB; }
    .recovery-radio.selected::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
    .recovery-text { color: var(--text); font-size: 14px; }
    .recovery-complete-btn { width: 100%; margin-top: 12px; padding: 11px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-family: 'DM Mono', monospace; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .recovery-complete-btn.done { background: rgba(255,135,171,0.12); border-color: #FF87AB; color: #FF87AB; }
    #header { padding: 52px 16px 16px; background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%); border-bottom: 1px solid var(--border); }
    #header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    #header-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 2px; }
    #header-title { font-size: 26px; font-weight: 700; margin-top: 2px; }
    #day-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .day-pill { flex-shrink: 0; width: 50px; padding: 10px 0; border-radius: 14px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.15s; }
    .day-pill-label { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .day-pill-emoji { font-size: 18px; }
    .day-pill-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
    #view-toggle { display: flex; gap: 8px; padding: 16px 16px 0; }
    .view-btn { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-family: 'DM Mono', monospace; font-weight: 600; cursor: pointer; letter-spacing: 1px; transition: all 0.15s; }
    .view-btn.active { border-color: var(--accent); background: rgba(0,255,135,0.08); color: var(--accent); }
    #day-header { padding: 20px 16px 12px; display: flex; align-items: center; gap: 12px; }
    #day-emoji { font-size: 34px; }
    #day-name { font-size: 20px; font-weight: 700; }
    #day-type { font-size: 13px; font-family: 'DM Mono', monospace; margin-top: 2px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin: 0 16px 12px; overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s; }
    .card.done { border-color: rgba(0,255,135,0.33); box-shadow: 0 0 24px rgba(0,255,135,0.1); }
    .card-inner { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .card-name { color: var(--text); font-weight: 600; font-size: 15px; }
    .card-meta { color: var(--muted); font-size: 12px; margin-top: 3px; font-family: 'DM Mono', monospace; }
    .card-sets-label { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
    .card-sets-count { font-size: 17px; font-weight: 700; color: var(--muted); font-family: 'DM Mono', monospace; text-align: right; }
    .card-sets-count.has-sets { color: var(--accent); }
    .card-chevron { color: var(--muted); font-size: 20px; transition: transform 0.2s; margin-left: 10px; }
    .card-chevron.open { transform: rotate(180deg); }
    .card-expanded { padding: 0 16px 16px; border-top: 1px solid var(--border); display: none; }
    .card-expanded.open { display: block; }
    .desc-box { background: var(--card2); border-radius: 10px; padding: 10px 12px; margin-top: 12px; margin-bottom: 8px; border-left: 3px solid #8855ff; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .desc-label { font-size: 10px; color: #8855ff; margin-bottom: 4px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .notes-box { background: var(--card2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; border-left: 3px solid var(--accent2); color: var(--muted); font-size: 13px; line-height: 1.6; }
    .notes-label { font-size: 10px; color: var(--accent2); margin-bottom: 4px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .last-session-box { background: var(--card2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; border-left: 3px solid var(--accent); }
    .last-session-label { font-size: 10px; color: var(--accent); margin-bottom: 6px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .last-session-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background: rgba(0,255,135,0.08); border: 1px solid rgba(0,255,135,0.2); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--text); font-family: 'DM Mono', monospace; }
    .set-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); transition: opacity 0.2s; }
    .set-row.logged { opacity: 0.45; }
    .set-num { width: 30px; height: 30px; border-radius: 8px; background: var(--card2); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; font-family: 'DM Mono', monospace; }
    .set-num.done { background: var(--accent); color: var(--bg); }
    .set-inputs { flex: 1; display: flex; gap: 8px; }
    .set-input-wrap { flex: 1; }
    .set-input-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; font-family: 'DM Mono', monospace; }
    .set-input { width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 16px; font-family: 'DM Mono', monospace; outline: none; }
    .log-btn { width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0; background: var(--accent); color: var(--bg); border: none; cursor: pointer; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .log-btn.logged { background: rgba(0,255,135,0.13); color: var(--accent); cursor: default; }
    .warmup-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin: 0 16px 16px; display: flex; align-items: flex-start; gap: 10px; }
    .warmup-label { font-size: 11px; color: var(--accent); margin-bottom: 4px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .warmup-text { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .post-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin: 0 16px 12px; display: flex; align-items: flex-start; gap: 10px; }
    .post-label { font-size: 11px; color: var(--accent2); margin-bottom: 4px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .post-text { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .game-card { margin: 0 16px; background: var(--card); border-radius: 20px; padding: 48px 24px; text-align: center; }
    .game-emoji { font-size: 64px; margin-bottom: 16px; }
    .game-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .game-sub { color: var(--muted); font-size: 14px; }
    .run-phase-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 0 16px 12px; }
    .run-phase-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .run-phase-name { color: var(--text); font-weight: 600; font-size: 15px; }
    .run-effort-badge { border-radius: 8px; padding: 3px 10px; font-size: 12px; font-family: 'DM Mono', monospace; font-weight: 600; }
    .run-desc { color: var(--muted); font-size: 13px; }
    .run-duration { font-size: 12px; margin-top: 6px; font-family: 'DM Mono', monospace; }
    .run-log-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 0 16px 12px; }
    .run-log-label { font-size: 11px; color: var(--muted); margin-bottom: 12px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .run-inputs { display: flex; gap: 10px; margin-bottom: 12px; }
    .run-input-wrap { flex: 1; }
    .run-input-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
    .run-input { width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 15px; font-family: 'DM Mono', monospace; outline: none; }
    .save-btn { width: 100%; background: var(--accent); color: var(--bg); border: none; border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'DM Mono', monospace; transition: all 0.2s; }
    .run-history-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 0 16px 12px; }
    .run-history-label { font-size: 11px; color: var(--muted); margin-bottom: 12px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .run-history-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-family: 'DM Mono', monospace; }
    .run-history-row:last-child { border-bottom: none; }
    .run-history-date { color: var(--muted); font-size: 12px; }
    .run-history-data { color: var(--text); font-size: 13px; }
    #progress-view { padding: 20px 16px; }
    .progress-list-label { font-size: 11px; color: var(--muted); margin-bottom: 16px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .progress-ex-btn { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left; }
    .progress-ex-name { color: var(--text); font-weight: 600; font-size: 14px; }
    .progress-ex-meta { color: var(--muted); font-size: 11px; margin-top: 3px; font-family: 'DM Mono', monospace; }
    .progress-ex-last-label { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; text-align: right; }
    .progress-ex-last-val { color: var(--accent); font-weight: 700; font-family: 'DM Mono', monospace; font-size: 13px; }
    .back-btn { background: transparent; border: 1px solid var(--border); border-radius: 10px; padding: 9px 16px; color: var(--muted); font-size: 13px; cursor: pointer; margin-bottom: 20px; font-family: 'DM Mono', monospace; }
    .progress-detail-name { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
    .progress-detail-meta { font-size: 12px; color: var(--muted); margin-bottom: 20px; font-family: 'DM Mono', monospace; }
    .session-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
    .session-date { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-family: 'DM Mono', monospace; }
    .session-set-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; font-family: 'DM Mono', monospace; }
    .session-set-row:last-child { border-bottom: none; }
    .no-data-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 44px 24px; text-align: center; margin-bottom: 12px; }

    .rest-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px 24px; text-align: center; margin: 0 16px; }
    .run-prog-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 0 16px 12px; }
    .run-prog-label { font-size: 11px; color: var(--muted); margin-bottom: 10px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .run-prog-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .run-prog-row:last-child { border-bottom: none; }
    .run-prog-week { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; }
    .run-prog-dist { color: var(--text); font-weight: 600; }
    .run-prog-pace { color: var(--muted); font-size: 12px; }
    /* Stats tab */
    #stats-view { padding: 20px 16px; }
    .stats-section-label { font-size: 11px; color: var(--muted); margin-bottom: 14px; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    .stats-ex-btn { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left; }
    .stats-ex-name { color: var(--text); font-weight: 600; font-size: 14px; }
    .stats-ex-meta { color: var(--muted); font-size: 11px; margin-top: 3px; font-family: 'DM Mono', monospace; }
    .stats-ex-best { text-align: right; flex-shrink: 0; margin-left: 10px; }
    .stats-ex-best-label { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
    .stats-ex-best-val { color: var(--accent); font-weight: 700; font-family: 'DM Mono', monospace; font-size: 13px; }
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .chart-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .chart-subtitle { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 14px; }
    .chart-no-data { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }
    /* 75 soft calendar */
    .calendar-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .calendar-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .calendar-subtitle { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 14px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; }
    .cal-day { width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); position: relative; cursor: default; }
    .cal-day.complete { background: var(--accent); border-color: var(--accent); }
    .cal-day.partial { background: rgba(255,210,0,0.25); border-color: rgba(255,210,0,0.5); }
    .cal-day.missed { background: rgba(255,80,80,0.25); border-color: rgba(255,80,80,0.4); }
    .cal-day.today { border-color: #FFB400; box-shadow: 0 0 6px rgba(255,180,0,0.5); }
    .cal-milestone { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; text-align: center; margin-top: 8px; display: flex; justify-content: space-between; }
    .cal-legend { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
    .cal-legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    /* Session notes */
    .notes-section { margin: 0 16px 12px; }
    .notes-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 1px; margin-bottom: 6px; }
    .notes-prev { background: var(--card2); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); margin-bottom: 6px; line-height: 1.5; font-style: italic; border-left: 3px solid var(--border); }
    .notes-prev-label { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 4px; opacity: 0.7; }
    textarea.notes-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; resize: none; min-height: 70px; line-height: 1.5; }
    textarea.notes-input::placeholder { color: var(--muted); }
    /* Workout complete */
    .complete-section { margin: 0 16px 12px; }
    .complete-btn { width: 100%; padding: 15px; border-radius: 14px; border: 2px solid var(--accent); background: transparent; color: var(--accent); font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 1px; transition: all 0.2s; }
    .complete-btn.done { background: var(--accent); color: var(--bg); }
    .complete-summary { text-align: center; font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 6px; }
    /* Eating checkbox */
    .eating-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin: 0 16px 12px; display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>



<div id="header">
  <div id="header-top">
    <div>
      <div id="header-label">TRAINING LOG</div>
      <div id="header-title">Simon's Program</div>
    </div>
    <div id="soft75-badge">
      <div id="soft75-label">75 SOFT</div>
      <div id="soft75-day">--</div>
      <div id="soft75-sub">/ 75 DAYS</div>
      <div id="soft75-bar-wrap"><div id="soft75-bar" style="width:0%"></div></div>
    </div>
  </div>
  <div id="water-widget">
    <span style="font-size:20px">💧</span>
    <div style="flex:1">
      <div style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:4px">WATER TODAY · +100ml per tap</div>
      <div id="water-bar-wrap"><div id="water-bar" style="width:0%"></div></div>
      <div style="font-size:11px;color:var(--accent2);font-family:'DM Mono',monospace;margin-top:4px" id="water-ml-label">0 / 3000ml</div>
    </div>
    <div id="water-controls">
      <button class="water-btn" onclick="adjustWater(-1)">−</button>
      <div id="water-count">0</div>
      <button class="water-btn" onclick="adjustWater(1)">+</button>
    </div>
  </div>
  <div id="day-pills"></div>
</div>

// ---- 75 SOFT COUNTER ----
function update75Soft() {
  const start = new Date(2026, 7, 3);
  const now = new Date();
  const diffMs = now - start;
  const diffDays = Math.floor(diffMs / (24*60*60*1000)) + 1;
  const el = document.getElementById('soft75-day');
  const bar = document.getElementById('soft75-bar');
  const sub = document.getElementById('soft75-sub');
  if (!el) return;
  // Before start date
  if (diffDays <= 0) {
    const daysUntil = Math.abs(diffDays) + 1;
    el.textContent = 'DAY 0';
    if (bar) bar.style.width = '0%';
    if (sub) sub.textContent = 'STARTS IN ' + daysUntil + 'd';
    return;
  }
  const day = Math.min(diffDays, 75);
  const pct = Math.min((day / 75) * 100, 100);
  el.textContent = 'DAY ' + day;
  if (bar) bar.style.width = pct + '%';
  const milestones = [{d:19,label:'25%'},{d:38,label:'50%'},{d:57,label:'75%'},{d:75,label:'DONE 🏆'}];
  const next = milestones.find(m => m.d > day);
  if (sub && next) sub.textContent = next.label + ' in ' + (next.d - day) + 'd';
  else if (sub && day >= 75) sub.textContent = 'COMPLETE 🏆';
}

// ---- WATER COUNTER ----
function getWaterKey() { return 'water-' + new Date().toLocaleDateString(); }
function getWaterCount() { return parseInt(localStorage.getItem(getWaterKey()) || '0'); }
function adjustWater(delta) {
  const current = getWaterCount();
  const next = Math.min(Math.max(current + delta, 0), 30);
  localStorage.setItem(getWaterKey(), next);
  updateWaterUI();
}
function updateWaterUI() {
  const count = getWaterCount();
  const ml = count * 100;
  const pct = (count / 30) * 100;
  const countEl = document.getElementById('water-count');
  const barEl = document.getElementById('water-bar');
  const mlEl = document.getElementById('water-ml-label');
  if (countEl) countEl.textContent = ml + 'ml';
  if (barEl) { barEl.style.width = pct + '%'; barEl.style.background = count >= 30 ? 'var(--accent)' : 'var(--accent2)'; }
  if (mlEl) mlEl.textContent = ml + ' / 3000ml' + (count >= 30 ? ' ✓' : '');
}

function getExerciseHistory(dayIndex, exId) {

  const selected = saved.selected || '';
  let html = `<div class="recovery-card"><div class="recovery-title">🧘 ACTIVE RECOVERY — CHOOSE ONE</div>`;
  opts.forEach(opt => {
    const isSel = selected === opt;
    html += `<div class="recovery-option" onclick="selectRecovery('${opt}','${key}')">

  });

  html += `</div>`;
  return html;
}

  const saved = (() => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; } })();

}

        <div class="set-inputs">
          <div class="set-input-wrap"><div class="set-input-label">LBS</div><input class="set-input" type="number" placeholder="0" id="w-${selectedDay}-${ex.id}-${si}" value="${set.weight!=null?set.weight:''}" ${set.logged?'disabled':''}></div>
          <div class="set-input-wrap"><div class="set-input-label">REPS</div><input class="set-input" type="number" placeholder="${ex.isMaxReps?'max':'0'}" id="r-${selectedDay}-${ex.id}-${si}" value="${set.reps!=null?set.reps:''}" ${set.logged?'disabled':''}></div>
        </div>
        <button class="log-btn${set.logged?' logged':''}" id="logbtn-${selectedDay}-${ex.id}-${si}" onclick="logSet(${selectedDay},'${ex.id}',${si},${ex.restSeconds},${ex.sets})" ${set.logged?'disabled':''}>✓</button>
      </div>`;
    });

    html += `<div class="card${allLogged?' done':''}" id="card-${selectedDay}-${ex.id}">
      <div class="card-inner" onclick="toggleCard('${selectedDay}-${ex.id}')">
        <div style="flex:1;margin-right:10px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="card-name">${ex.name}</span>
            ${allLogged?'<span style="color:var(--accent);font-size:13px">✓</span>':''}
          </div>
          <div class="card-meta">${metaText}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div><div class="card-sets-label">SETS</div><div class="card-sets-count${loggedCount>0?' has-sets':''}" id="setcount-${selectedDay}-${ex.id}">${loggedCount}/${ex.sets}</div></div>
          <span class="card-chevron" id="chev-${selectedDay}-${ex.id}">⌄</span>
        </div>
      </div>
      <div class="card-expanded" id="exp-${selectedDay}-${ex.id}">${expandedHtml}</div>
    </div>`;
  });

  if (day.postWorkout) {
    html += `<div class="post-box"><span style="font-size:20px;flex-shrink:0">✅</span><div><div class="post-label">AFTER WORKOUT</div><div class="post-text">${day.postWorkout}</div></div></div>`;
  }
  // Session notes
  const todayKey = new Date().toLocaleDateString();
  const noteKey = 'session-note-' + todayKey + '-' + selectedDay;
  const prevNoteKey = 'session-note-prev-' + selectedDay;
  const prevNote = localStorage.getItem(prevNoteKey) || '';
  const currentNote = localStorage.getItem(noteKey) || '';
  html += `<div class="notes-section">
    <div class="notes-label">📝 SESSION NOTES</div>
    ${prevNote ? `<div class="notes-prev"><div class="notes-prev-label">LAST SESSION</div>${prevNote}</div>` : ''}
    <textarea class="notes-input" id="session-note-input" placeholder="How did today feel? Any notes on form, energy, or pain..." onchange="saveNote('${noteKey}',${selectedDay})">${currentNote}</textarea>
  </div>`;
  // Workout complete button
  const completeKey = 'workout-complete-' + todayKey;
  const isComplete = localStorage.getItem(completeKey) == selectedDay;
  const totalEx = day.exercises ? day.exercises.length : 0;
  const loggedEx = day.exercises ? day.exercises.filter(ex => {
    const st = (exerciseSetState[selectedDay] || {})[ex.id] || [];
    return st.length > 0 && st.every(s => s.logged);
  }).length : 0;
  html += `<div class="complete-section">
    <button class="complete-btn${isComplete ? ' done' : ''}" onclick="markComplete(${selectedDay})">${isComplete ? '✓ SESSION COMPLETE' : 'MARK SESSION COMPLETE'}</button>
    <div class="complete-summary">${loggedEx}/${totalEx} exercises logged</div>
  </div>`;
  return html;
}

function renderRunDay(day) {
  const color = day.color;
  let html = '';
  day.run.structure.forEach(phase => {
    html += `<div class="run-phase-card"><div class="run-phase-top"><span class="run-phase-name">${phase.phase}</span><span class="run-effort-badge" style="background:${color}22;color:${color}">${phase.effort}</span></div><div class="run-desc">${phase.description}</div><div class="run-duration" style="color:${color}">⏱ ${phase.duration}</div></div>`;
  });

  if (day.progression) {
    html += `<div class="run-prog-card"><div class="run-prog-label">DISTANCE PROGRESSION</div>`;
    day.progression.forEach(p => {
      html += `<div class="run-prog-row"><span class="run-prog-week">${p.weeks}</span><span class="run-prog-dist">${p.distance}</span><span class="run-prog-pace">${p.pace}</span></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="run-log-card"><div class="run-log-label">LOG THIS RUN</div>
    <div class="run-inputs">
      <div class="run-input-wrap"><div class="run-input-label">TIME (min)</div><input class="run-input" type="text" id="run-time-${selectedDay}" placeholder="32:15"></div>
      <div class="run-input-wrap"><div class="run-input-label">DISTANCE (mi)</div><input class="run-input" type="text" id="run-dist-${selectedDay}" placeholder="3.1"></div>
    </div>
    <button class="save-btn" id="run-save-btn-${selectedDay}" onclick="saveRun(${selectedDay})">SAVE RUN</button>
  </div>`;

  const history = runLogs[selectedDay] || [];
  if (history.length > 0) {
    html += `<div class="run-history-card"><div class="run-history-label">RUN HISTORY</div>`;
    [...history].reverse().slice(0,6).forEach(run => {
      const data = [run.time?'⏱ '+run.time:'', run.distance?run.distance+'mi':''].filter(Boolean).join(' · ');
      html += `<div class="run-history-row"><span class="run-history-date">${run.date}</span><span class="run-history-data">${data}</span></div>`;
    });
    html += `</div>`;
  }

  if (day.postWorkout) {
    html += `<div class="post-box"><span style="font-size:20px;flex-shrink:0">✅</span><div><div class="post-label">AFTER WORKOUT</div><div class="post-text">${day.postWorkout}</div></div></div>`;
  }
  return html;
}

function renderStatsView() {
  let html = '<div id="stats-view">';
  if (!statsExercise) {
    // Exercise list
    html += '<div class="stats-section-label">📈 EXERCISE PROGRESS</div>';
    const allExercises = [];
    Object.entries(workoutPlan).forEach(([dayIdx, d]) => {
      if (d.exercises && !d.optional) d.exercises.forEach(ex => {
        if (!allExercises.find(e => e.id === ex.id)) allExercises.push({...ex, dayIndex:Number(dayIdx)});
      });
    });
    allExercises.forEach(ex => {
      const history = getExerciseHistory(ex.dayIndex, ex.id);
      const lastSession = history[history.length-1];
      const bestSet = lastSession?.sets?.reduce((best,s)=>(s?.weight>(best?.weight||0)?s:best),null);
      const rightSide = (bestSet && bestSet.weight > 0)
        ? `<div class="stats-ex-best"><div class="stats-ex-best-label">LAST BEST</div><div class="stats-ex-best-val">${bestSet.weight}lb×${bestSet.reps}</div></div>`
        : ex.isMaxReps && lastSession ? `<div class="stats-ex-best"><div class="stats-ex-best-label">LAST</div><div class="stats-ex-best-val">${lastSession.sets?.reduce((m,s)=>Math.max(m,s?.reps||0),0)} reps</div></div>`
        : `<span style="color:var(--border);font-size:20px">›</span>`;
      html += `<button class="stats-ex-btn" data-exid="${ex.id}" data-dayindex="${ex.dayIndex}"><div><div class="stats-ex-name">${ex.name}</div><div class="stats-ex-meta">${history.length} sessions logged</div></div>${rightSide}</button>`;
    });
    // 75 Soft calendar
    html += render75SoftCalendar();
  } else {
    // Chart view
    const ex = statsExercise;
    const history = getExerciseHistory(ex.dayIndex, ex.id);
    html += `<button class="back-btn" onclick="goBackStats()">← BACK</button>`;
    html += `<div class="chart-card">`;
    html += `<div class="chart-title">${ex.name}</div>`;
    const metricLabel = ex.isMaxReps ? 'Max Reps per Session' : 'Best Weight per Session (lbs)';
    html += `<div class="chart-subtitle">${metricLabel} · ${history.length} sessions</div>`;
    if (history.length < 2) {
      html += `<div class="chart-no-data">📊<br><br>${history.length === 0 ? 'No data yet — log some sets to see your progress.' : 'Log one more session to see your progress chart.'}</div>`;
    } else {
      // Build data points
      const points = history.map(session => {
        const val = ex.isMaxReps
          ? (session.sets||[]).reduce((m,s)=>Math.max(m,s?.reps||0),0)
          : (session.sets||[]).reduce((m,s)=>Math.max(m,s?.weight||0),0);
        return { date: session.date, val };
      }).filter(p => p.val > 0);
      if (points.length < 2) {
        html += `<div class="chart-no-data">Not enough data yet to chart.</div>`;
      } else {
        const vals = points.map(p => p.val);
        const minVal = Math.min(...vals);
        const maxVal = Math.max(...vals);
        const range = maxVal - minVal || 1;
        const W = 330, H = 160, PL = 40, PR = 16, PT = 16, PB = 36;
        const plotW = W - PL - PR, plotH = H - PT - PB;
        const xStep = plotW / (points.length - 1);
        const yScale = v => PT + plotH - ((v - minVal) / range) * plotH;
        const xScale = i => PL + i * xStep;
        // Grid lines
        let svgContent = '';
        [0,0.25,0.5,0.75,1].forEach(t => {
          const y = Math.round(PT + t * plotH);
          const label = Math.round(maxVal - t * range);
          svgContent += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#2a2a3a" stroke-width="1"/>`;
          svgContent += `<text x="${PL-4}" y="${y+4}" text-anchor="end" fill="#6b6b80" font-size="9" font-family="DM Mono,monospace">${label}</text>`;
        });
        // Line path
        const pathD = points.map((p,i) => `${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(p.val).toFixed(1)}`).join(' ');
        svgContent += `<path d="${pathD}" fill="none" stroke="#00FF87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
        // Area fill
        const areaD = pathD + ` L${xScale(points.length-1).toFixed(1)},${PT+plotH} L${PL},${PT+plotH} Z`;
        svgContent += `<path d="${areaD}" fill="url(#chartGrad)" opacity="0.2"/>`;
        // Dots + x labels
        points.forEach((p,i) => {
          const cx = xScale(i).toFixed(1), cy = yScale(p.val).toFixed(1);
          svgContent += `<circle cx="${cx}" cy="${cy}" r="4" fill="#00FF87" stroke="#0a0a0f" stroke-width="2"/>`;
          if (i === 0 || i === points.length-1 || points.length <= 6 || i % Math.ceil(points.length/5) === 0) {
            const parts = p.date.split('/');
            const label = parts.length >= 2 ? parts[0]+'/'+parts[1] : p.date;
            svgContent += `<text x="${cx}" y="${H-4}" text-anchor="middle" fill="#6b6b80" font-size="9" font-family="DM Mono,monospace">${label}</text>`;
          }
        });
        html += `<svg width="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
          <defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00FF87"/><stop offset="100%" stop-color="#00FF87" stop-opacity="0"/></linearGradient></defs>
          ${svgContent}
        </svg>`;
        // Best ever callout
        html += `<div style="display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          <div><div style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace">BEST EVER</div><div style="font-size:16px;font-weight:700;color:var(--accent);font-family:'DM Mono',monospace">${maxVal}${ex.isMaxReps?' reps':'lb'}</div></div>
          <div><div style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace">SESSIONS</div><div style="font-size:16px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace">${points.length}</div></div>
          <div><div style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace">FIRST</div><div style="font-size:16px;font-weight:700;color:var(--muted);font-family:'DM Mono',monospace">${points[0].val}${ex.isMaxReps?' reps':'lb'}</div></div>
        </div>`;
      }
    }
    html += '</div>';
    // Session history below chart
    if (history.length > 0) {
      html += '<div class="stats-section-label">SESSION HISTORY</div>';
      [...history].reverse().forEach(session => {
        html += `<div class="session-card"><div class="session-date">${session.date}</div>`;
        (session.sets||[]).forEach((s,j) => {
          html += `<div class="session-set-row"><span style="color:var(--muted)">Set ${j+1}</span><span style="color:var(--text)">${s?.weight}lb × ${s?.reps} reps</span></div>`;
        });
        html += '</div>';
      });
    }
  }
  html += '</div>';
  return html;
}

function render75SoftCalendar() {
  const start = new Date(2026, 7, 3);
  const todayDate = new Date();
  let html = '<div class="calendar-card" style="margin-top:20px">';
  html += '<div class="stats-section-label" style="margin-bottom:8px">🏆 75 SOFT CALENDAR</div>';
  // Stats summary
  let completeDays = 0, startedDays = 0;
  for (let i = 0; i < 75; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (d > todayDate) break;
    startedDays++;
    const dateStr = d.toLocaleDateString();
    const status = get75DayStatus(dateStr, d.getDay());
    if (status.allDone) completeDays++;
  }
  if (startedDays > 0) {
    html += `<div style="font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:12px">${completeDays}/${startedDays} days complete</div>`;
  }
  html += '<div class="calendar-grid">';
  for (let i = 0; i < 75; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const isFuture = d > todayDate;
    const isToday = d.toLocaleDateString() === todayDate.toLocaleDateString();
    const dateStr = d.toLocaleDateString();
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (!isFuture && !isToday) {
      const status = get75DayStatus(dateStr, d.getDay());
      if (status.allDone) cls += ' complete';
      else if (status.count === 3) cls += ' partial';
      else cls += ' missed';
    }
    html += `<div class="${cls}" title="Day ${i+1}: ${d.toLocaleDateString()}"></div>`;
  }
  html += '</div>';
  // Milestone markers
  html += '<div class="cal-milestone"><span>AUG 3</span><span>25%</span><span>50%</span><span>75%</span><span>OCT 16</span></div>';
  // Legend
  html += `<div class="cal-legend">
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--accent)"></div>COMPLETE</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(255,210,0,0.25);border:1px solid rgba(255,210,0,0.5)"></div>3/4 RULES</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(255,80,80,0.25)"></div>MISSED</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--bg);border:1px solid var(--border)"></div>UPCOMING</div>
  </div>`;
  html += '</div>';
  return html;
}

function get75DayStatus(dateStr, dayOfWeek) {
  const water = parseInt(localStorage.getItem('water-' + dateStr) || '0') >= 30;
  const reading = localStorage.getItem('reading-' + dateStr) === 'done';
  const eating = localStorage.getItem('eating-' + dateStr) === 'done';
  const completeVal = localStorage.getItem('workout-complete-' + dateStr);
  const workoutDone = completeVal !== null && completeVal !== '';
  const recoveryData = (() => { try { return JSON.parse(localStorage.getItem('recovery-' + dateStr) || '{}'); } catch { return {}; } })();
  const isGameDay = dayOfWeek === 2 || dayOfWeek === 4;
  const movement = workoutDone || isGameDay;
  const count = [water, reading, eating, movement].filter(Boolean).length;
  return { water, reading, eating, movement, count, allDone: count === 4 };
}

function goBackStats() { statsExercise = null; renderMain(); }

function attachStatsEvents() {
  document.querySelectorAll('.stats-ex-btn').forEach(btn => {
    btn.onclick = () => {
      const exId = btn.dataset.exid;
      const dayIndex = Number(btn.dataset.dayindex);
      const day = workoutPlan[dayIndex];
      const ex = day?.exercises?.find(e => e.id === exId);
      if (ex) { statsExercise = {...ex, dayIndex}; renderMain(); }
    };
  });
}

function markComplete(dayIndex) {
  const dateKey = new Date().toLocaleDateString();
  const completeKey = 'workout-complete-' + dateKey;
  localStorage.setItem(completeKey, dayIndex);
  // Save current note as "prev" for next session
  const noteKey = 'session-note-' + dateKey + '-' + dayIndex;
  const note = localStorage.getItem(noteKey) || '';
  if (note) localStorage.setItem('session-note-prev-' + dayIndex, note);
  renderMain();
}

function saveNote(noteKey, dayIndex) {
  const val = document.getElementById('session-note-input')?.value || '';
  localStorage.setItem(noteKey, val);
}

function toggleCard(key) {
  const exp = document.getElementById('exp-'+key);
  const chev = document.getElementById('chev-'+key);
  if (!exp) return;
  exp.classList.toggle('open');
  chev.classList.toggle('open');
}

function getExSetState(dayIndex, exId, numSets) {
  if (!exerciseSetState[dayIndex]) exerciseSetState[dayIndex] = {};
  if (!exerciseSetState[dayIndex][exId]) {
    exerciseSetState[dayIndex][exId] = Array.from({length:numSets}, ()=>({logged:false,weight:null,reps:null}));
  }
  return exerciseSetState[dayIndex][exId];
}

function logSet(dayIndex, exId, setIndex, restSeconds, totalSets) {
  const w = Number(document.getElementById(`w-${dayIndex}-${exId}-${setIndex}`)?.value)||0;
  const r = Number(document.getElementById(`r-${dayIndex}-${exId}-${setIndex}`)?.value)||0;
  getExSetState(dayIndex, exId, totalSets)[setIndex] = {logged:true, weight:w, reps:r};
  const dateKey = new Date().toLocaleDateString();
  if (!workoutLogs[dayIndex]) workoutLogs[dayIndex] = {};
  if (!workoutLogs[dayIndex][exId]) workoutLogs[dayIndex][exId] = {};
  if (!workoutLogs[dayIndex][exId][dateKey]) workoutLogs[dayIndex][exId][dateKey] = {date:dateKey, sets:[]};
  workoutLogs[dayIndex][exId][dateKey].sets[setIndex] = {weight:w, reps:r};
  saveWorkoutLogs(workoutLogs);
  const row = document.getElementById(`setrow-${dayIndex}-${exId}-${setIndex}`);
  const num = document.getElementById(`setnum-${dayIndex}-${exId}-${setIndex}`);
  const btn = document.getElementById(`logbtn-${dayIndex}-${exId}-${setIndex}`);
  if (row) row.classList.add('logged');
  if (num) num.classList.add('done');
  if (btn) { btn.classList.add('logged'); btn.disabled = true; }
  const state = getExSetState(dayIndex, exId, totalSets);
  const loggedCount = state.filter(s=>s.logged).length;
  const countEl = document.getElementById(`setcount-${dayIndex}-${exId}`);
  if (countEl) { countEl.textContent = `${loggedCount}/${totalSets}`; countEl.classList.add('has-sets'); }
  const card = document.getElementById(`card-${dayIndex}-${exId}`);
  if (loggedCount === totalSets && card) card.classList.add('done');
  if (setIndex < totalSets-1) showRestNote(`setrow-${dayIndex}-${exId}-${setIndex}`, restSeconds);
}

function saveRun(dayIndex) {
  const time = document.getElementById(`run-time-${dayIndex}`)?.value||'';
  const dist = document.getElementById(`run-dist-${dayIndex}`)?.value||'';
  if (!time && !dist) return;
  if (!runLogs[dayIndex]) runLogs[dayIndex] = [];
  runLogs[dayIndex].push({date:new Date().toLocaleDateString(), time, distance:dist});
  saveRunLogs(runLogs);
  const btn = document.getElementById(`run-save-btn-${dayIndex}`);
  if (btn) { btn.textContent='SAVED ✓'; btn.style.background='rgba(0,255,135,0.13)'; btn.style.color='var(--accent)'; btn.style.border='1px solid var(--accent)'; }
  setTimeout(()=>renderMain(), 1500);
}

function showRestNote(rowId, seconds) {
  const mins = Math.floor(seconds/60);
  const secs = seconds % 60;
  const label = mins > 0 ? `${mins}m ${secs > 0 ? secs+'s' : ''}rest` : `${secs}s rest`;
  const existing = document.getElementById('rest-note-'+rowId);
  if (existing) existing.remove();
  const note = document.createElement('div');
  note.id = 'rest-note-'+rowId;
  note.style.cssText = 'padding:6px 0;font-size:12px;color:var(--accent);font-family:DM Mono,monospace;letter-spacing:1px;text-align:center;border-bottom:1px solid var(--border);';
  note.textContent = '⏱ ' + label.trim();
  const row = document.getElementById(rowId);
  if (row) row.insertAdjacentElement('afterend', note);
}

renderAll();
</script>
</body>
</html>
